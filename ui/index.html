<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pokemon Damage Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-4">

    <h2 class="mb-4">Pokémon Damage Calculator</h2>

    <!-- Your Pokémon -->
    <div class="card mb-4">

        <div class="card-header">
            Your Pokémon
        </div>

        <div class="card-body">

            <!-- Pokémon -->
            <div class="mb-3">
                <label class="form-label">Pokémon</label>
                <select id="pokemon" placeholder="Select a Pokémon"></select>
            </div>

            <!-- Form -->
            <div class="mb-3">
                <label class="form-label">Form</label>
                <select id="pokemonForm" placeholder="Select a Pokémon Form" disabled></select>
            </div>

            <!-- Move -->
            <div class="mb-3">
                <label class="form-label">Move</label>
                <select id="move" placeholder="Select a Move" disabled></select>
            </div>

            <!-- Shadow -->
            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="checkbox"
                       id="shadow">

                <label class="form-check-label" for="shadow">
                    Shadow
                </label>
            </div>

            <div class="row">

                <div class="col-md-3">
                    <label class="form-label">Min Atk</label>
                    <select id="minAtk"></select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Max Atk</label>
                    <select id="maxAtk"></select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Min Level</label>
                    <select id="minLevel"></select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Max Level</label>
                    <select id="maxLevel"></select>
                </div>

            </div>

        </div>

    </div>

    <!-- Enemy -->

    <div class="card mb-4">

        <div class="card-header">
            Enemy
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label class="form-label">Enemy</label>
                <select id="enemy" placeholder="Select an Enemy"></select>
            </div>

            <div class="mb-3">
                <label class="form-label">Enemy Pokémon</label>
                <select id="enemyPokemon" placeholder="Select a Pokémon"></select>
            </div>

            <div class="mb-3">
                <label class="form-label">Enemy Form</label>
                <select id="enemyForm" placeholder="Select a Pokémon Form" disabled></select>
            </div>

            <div class="mb-3">
                <label class="form-label">Trainer Level</label>
                <select id="trainerLevel"></select>
            </div>

        </div>

    </div>

    <div id="message"></div>

    <div class="text-center">

        <button class="btn btn-primary btn-lg"
                id="calculateButton">
            Calculate Damage
        </button>

    </div>

    <div id="resultsSection" class="d-none mt-5">

        <div id="enemyCard"></div>
    
        <div id="breakpointsTable" class="mt-4"></div>
    
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
<script src="app.js"></script>

</body>
</html>
