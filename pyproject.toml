[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfl-research"
version = "0.1.0"
description = "Simple access to Pokémon Go's Game Master file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MocTalox" }
]

[tool.hatch.build.targets.wheel]
packages = ["src/nfl"]
